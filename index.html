<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Pop Party!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #a8ede, #fed6e3);
            background-color: #ff9a9e;
            overflow: hidden;
            height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            user-select: none;
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .balloon {
            position: absolute;
            width: 80px;
            height: 100px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            animation: floatUp 4s linear infinite;
            bottom: -120px;
            box-shadow: inset -10px -10px 0px rgba(0,0,0,0.1);
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 36px;
            width: 2px;
            height: 15px;
            background-color: #666;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
            }
            100% {
                transform: translateY(-110vh) scale(1);
            }
        }
    </style>
</head>
<body>

    <h1>🎈 Tap the Balloons! 🎈</h1>

    <script>
        // Cute audio beep using Web Audio API so you don't need external sound files!
        function playPopSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            
            // Random colors
            const colors = ['#ff6b6b', '#48dbfb', '#1dd1a1', '#feca57', '#ff9ff3', '#54a0ff'];
            balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Random horizontal position
            const randomX = Math.random() * (window.innerWidth - 100);
            balloon.style.left = randomX + 'px';
            
            // Random speed
            const randomDuration = Math.random() * 3 + 3;
            balloon.style.animationDuration = randomDuration + 's';

            // Pop on click or touch
            balloon.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                playPopSound();
                balloon.style.transform = 'scale(1.4)';
                balloon.style.opacity = '0';
                setTimeout(() => balloon.remove(), 100);
            });

            // Remove when it floats off screen
            balloon.addEventListener('animationend', () => {
                balloon.remove();
            });

            document.body.appendChild(balloon);
        }

        // Spawn balloons continuously
        setInterval(createBalloon, 600);
    </script>
</body>
</html>
